<html >
<head>
<title>Mouse Events</title>
<style>
#mouseBox {
width: 200px;
height: 100px;
margin: 10px;
padding: 20px;
border: 2px solid black;
text-align: center;
}
</style>
</head>
<body>
<h1>Mouse Events </h1>
<div id="mouseBox"
onmouseover="mouseOver()"
onmouseout="mouseOut()"
onclick="mouseClick()"
ondblclick="mouseDoubleClick()"
onmousedown="mouseDown()"
onmouseup="mouseUp()">
Hover or Click Me!
</div>
<script>
function mouseOver()
{
document.getElementById("mouseBox").style.backgroundColor = "lightblue";
}
function mouseOut()
{
document.getElementById("mouseBox").style.backgroundColor = "white";
}
function mouseClick()
{
alert("Mouse Clicked!");
}
function mouseDoubleClick()
{
alert("Mouse Double Clicked!");
}
function mouseDown()
{
document.getElementById("mouseBox").style.border= "5px solid red";
}
function mouseUp()
{
document.getElementById("mouseBox").style.border= "20px solid black";
}
</script>
</body>
</html>
