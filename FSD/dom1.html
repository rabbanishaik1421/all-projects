    <meta charset="UTF-8">

    <title>Document</title>

<body>
    <p class="title" id="demo">Document Object Model</p>
    <p class="title" id="demo1">Document methods</p>

    <button type="button" onclick="changeSize()">Click Me</button>
    <button type="button" onclick="changeColor()">Change Color</button>
    <button type="button" onclick="changeFontSize()">Change Size</button>

    <script>
        function changeFontSize(){
            let elements = document.querySelectorAll(".title");
            // console.log(elements);
            for(let i=0; i<elements.length; i++){
                elements[i].style.fontSize="6px";
            }
            
        }


        function changeColor(){
            let elements = document.getElementsByTagName("p");
            // console.log(elements);
            for(let i=0; i<elements.length; i++){
                elements[i].style.background="green";
                elements[i].style.color="#fff";
            }
            
        }


        function changeSize(){
            document.querySelector(".title").style.fontSize="28px";
            document.querySelector(".title").style.color="#060";
            document.querySelector(".title").style.fontWeight="normal";
            document.querySelector(".title").style.background="#fafafa";
        }
